name: FestivaFlow CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Lint, Test & Validate WCAG/Security Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check total repository size (< 10 MB limit)
        run: |
          REPO_SIZE_KB=$(du -sk --exclude='.git' . | cut -f1)
          echo "Repository size (excluding .git): ${REPO_SIZE_KB} KB"
          if [ "$REPO_SIZE_KB" -gt 10240 ]; then
            echo "Error: Repository exceeds 10 MB maximum size limit!"
            exit 1
          fi
          echo "Success: Repository size is under 10 MB."

      - name: Run Pytest test suite with coverage
        run: |
          python -m pytest tests/ -v
