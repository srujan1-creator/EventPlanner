name: FestivaFlow CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Repository Size (< 10 MB)
        run: |
          REPO_SIZE_KB=$(du -sk --exclude='.git' . | cut -f1)
          echo "Total Repository Size: ${REPO_SIZE_KB} KB"
          if [ "$REPO_SIZE_KB" -gt 10240 ]; then
            echo "ERROR: Repository exceeds 10 MB limit (${REPO_SIZE_KB} KB)"
            exit 1
          fi

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/ -v
