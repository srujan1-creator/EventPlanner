[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "festivaflow"
version = "1.0.0"
description = "FestivaFlow — Celebration & Event Planner Platform"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S"]
ignore = [
    "B008",   # FastAPI dependency injection idiom: Depends(get_db) and Query(...)
    "S101",   # Use of assert in tests
    "S104",   # Possible binding to all interfaces (0.0.0.0) in local dev
    "S105",   # Possible hardcoded password (test dummy passwords)
    "S106",   # Possible hardcoded password func argument
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_default_fixture_loop_scope = "function"
